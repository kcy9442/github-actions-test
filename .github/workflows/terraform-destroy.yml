name: Terraform Destroy (dambda) - DANGER

# 수동 실행 전용, 게다가 실행할 때마다 "destroy"를 정확히 입력해야 진행됨 - 실수로 버튼을
# 눌러도 바로 전체 인프라가 날아가지 않게 하는 최소한의 안전장치. dambda-bootstrap(OIDC
# provider, github-actions-role, Terraform state 버킷/락 테이블)은 이 워크플로우 범위 밖 -
# 그것까지 지우면 이 워크플로우 자신이 돌아갈 권한/state 자체가 사라짐.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '정말 dambda 인프라를 통째로 삭제하려면 "destroy"를 정확히 입력하세요'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "confirm 입력이 'destroy'와 정확히 일치하지 않아 중단합니다."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform init
        working-directory: dambda
        run: terraform init -input=false

      # 이전 apply가 AWS 리소스 생성 뒤 state 저장 전에 실패하면, 서브넷-라우팅 테이블
      # association만 AWS에 남고 Terraform state에는 없는 상태가 될 수 있다. 이 경우
      # destroy가 서브넷/라우팅 테이블을 제거하지 못하므로, state가 추적하지 않는
      # 프로젝트 라우팅 테이블 association만 먼저 해제한다. state에 있는 association은
      # Terraform이 정상 순서로 삭제해야 하므로 건드리지 않는다.
      - name: Detach orphaned route-table associations before destroy
        working-directory: dambda
        run: |
          set -euo pipefail

          tracked_ids=$(mktemp)
          while IFS= read -r address; do
            terraform state show -no-color "$address" \
              | awk -F ' = ' '/^[[:space:]]*id[[:space:]]*=/ {gsub(/"/, "", $2); print $2}' \
              >> "$tracked_ids"
          done < <(terraform state list | grep '^module\.network\(_us\)\?\.aws_route_table_association\.' || true)

          for region in ap-northeast-2 us-east-1; do
            aws ec2 describe-route-tables --region "$region" \
              --filters 'Name=tag:project,Values=dambda' \
              --output json \
              | jq -r '
                  .RouteTables[]
                  | select((.Tags | map(select(.Key == "Name") | .Value) | first // "") | test("-((private)|(public))-rt-"))
                  | .Associations[]?
                  | select(.Main != true)
                  | .RouteTableAssociationId
                ' \
              | while IFS= read -r association_id; do
                  if ! grep -Fxq "$association_id" "$tracked_ids"; then
                    echo "Detaching orphaned route-table association: $association_id ($region)"
                    aws ec2 disassociate-route-table \
                      --region "$region" \
                      --association-id "$association_id"
                  fi
                done
          done

      # ArgoCD Application은 기본 finalizer가 남으면 Terraform provider가 삭제 완료를
      # 끝없이 기다릴 수 있다. 이 작업은 destroy에서만, 현재 앱 네임스페이스로만 수행한다.
      - name: Remove app GitOps finalizers before destroy
        run: |
          if aws eks describe-cluster --region ap-northeast-2 --name my-app-dev-eks-cluster >/dev/null 2>&1; then
            aws eks update-kubeconfig --region ap-northeast-2 --name my-app-dev-eks-cluster
            kubectl delete application backend -n argocd --ignore-not-found --wait=false || true
            kubectl patch application backend -n argocd --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            kubectl delete targetgroupbinding backend -n app --ignore-not-found --wait=false || true
            kubectl patch targetgroupbinding backend -n app --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          fi

      # S3는 비어 있어야 삭제된다. 버전/삭제 마커까지 app 버킷에서 제거한다.
      # dambda-images와 bootstrap/state 버킷은 의도적으로 이 목록에 포함하지 않는다.
      - name: Empty application S3 buckets before destroy
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          for NAME in static-site uploads review-photos product-images quarantine; do
            BUCKET="my-app-dev-${NAME}-${ACCOUNT_ID}"
            if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
              continue
            fi
            while true; do
              DELETE_PAYLOAD=$(aws s3api list-object-versions --bucket "$BUCKET" --output json | jq -c '{Objects: ((.Versions // []) + (.DeleteMarkers // []) | map({Key, VersionId})), Quiet: true}')
              COUNT=$(echo "$DELETE_PAYLOAD" | jq '.Objects | length')
              [ "$COUNT" -eq 0 ] && break
              aws s3api delete-objects --bucket "$BUCKET" --delete "$DELETE_PAYLOAD"
            done
          done

      # 클러스터가 먼저 사라진 partial destroy에서는 kubernetes/helm provider가 EKS
      # data source를 읽는 순간 실패한다. 실제 클러스터가 없으면 그 안의 객체도 이미
      # 함께 삭제된 상태이므로, Kubernetes/Helm 객체만 state에서 잊고 AWS 인프라 삭제를
      # 계속한다. EKS 자체와 다른 AWS 리소스 state는 절대 제거하지 않는다.
      - name: Remove Kubernetes state when EKS cluster is already gone
        working-directory: dambda
        run: |
          set -euo pipefail
          if aws eks describe-cluster --region ap-northeast-2 --name my-app-dev-eks-cluster >/dev/null 2>&1; then
            echo "EKS cluster still exists; Kubernetes resources remain Terraform-managed."
            exit 0
          fi

          echo "EKS cluster is already gone; removing only unreachable Kubernetes/Helm objects from state."
          while IFS= read -r address; do
            case "$address" in
              module.eks.kubernetes_*|module.eks.helm_release.*)
                terraform state rm "$address"
                ;;
            esac
          done < <(terraform state list)

      - name: Terraform Destroy
        id: terraform_destroy
        continue-on-error: true
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
        # 앞 단계에서 실제로 존재하지 않는 Kubernetes 객체를 state에서 정리했으므로,
        # destroy 중 data source를 다시 읽어 이미 삭제된 EKS 클러스터 때문에 중단되지
        # 않도록 state refresh를 생략한다.
        run: terraform destroy -input=false -refresh=false -auto-approve

      # VPC 삭제 실패는 대개 이전 apply/수동 작업에서 state 밖에 남은 ENI, Endpoint,
      # 서브넷 또는 라우팅 테이블 때문이다. 삭제하지 않고 정확한 의존성만 출력해 다음
      # 복구 작업의 대상을 확정한다.
      - name: Diagnose remaining VPC dependencies
        if: steps.terraform_destroy.outcome == 'failure'
        working-directory: dambda
        run: |
          set -euo pipefail
          VPC_ID=$(terraform state show -no-color module.network.aws_vpc.main \
            | awk -F ' = ' '/^[[:space:]]*id[[:space:]]*=/ {gsub(/"/, "", $2); print $2; exit}')

          if [ -z "$VPC_ID" ]; then
            echo "VPC ID를 Terraform state에서 찾지 못했습니다."
            exit 1
          fi

          echo "Remaining dependencies for VPC: $VPC_ID"
          aws ec2 describe-vpc-endpoints --region ap-northeast-2 --filters "Name=vpc-id,Values=$VPC_ID" --output table
          aws ec2 describe-network-interfaces --region ap-northeast-2 --filters "Name=vpc-id,Values=$VPC_ID" --output table
          aws ec2 describe-nat-gateways --region ap-northeast-2 --filter "Name=vpc-id,Values=$VPC_ID" --output table
          aws ec2 describe-subnets --region ap-northeast-2 --filters "Name=vpc-id,Values=$VPC_ID" --output table
          aws ec2 describe-route-tables --region ap-northeast-2 --filters "Name=vpc-id,Values=$VPC_ID" --output table
          aws ec2 describe-internet-gateways --region ap-northeast-2 --filters "Name=attachment.vpc-id,Values=$VPC_ID" --output table
          aws ec2 describe-security-groups --region ap-northeast-2 --filters "Name=vpc-id,Values=$VPC_ID" --output table

      - name: Fail when Terraform destroy did not finish
        if: steps.terraform_destroy.outcome == 'failure'
        run: |
          echo "Terraform destroy가 완료되지 않았습니다. 바로 위 VPC dependency 출력 결과를 확인하세요."
          exit 1

